[tool.black]
target-version = ['py36', 'py37']
line-length = 100
exclude = '''
(
    \.git
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.eggs\/
    | build
    | dist
    | tutorials
    | venv\/
    | test_serde_full\.py
    | third_party
)
'''

[tool.cibuildwheel]
# Build for Python 3.9-3.13
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"

[tool.cibuildwheel.linux]
# Use manylinux_2_28 for broad compatibility (glibc 2.28+)
# Compatible with Ubuntu 20.04+, Debian 10+, JetPack 5+
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Build for both x86_64 and ARM64
archs = ["x86_64", "aarch64"]

# Install build dependencies
before-all = """
yum install -y wget curl git automake libtool clang
CMAKE_VERSION=3.28.0
ARCH=$(uname -m)
if [ "$ARCH" = "aarch64" ]; then
    cmake_file="cmake-${CMAKE_VERSION}-linux-aarch64.sh"
else
    cmake_file="cmake-${CMAKE_VERSION}-linux-x86_64.sh"
fi
wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${cmake_file}
sh ${cmake_file} --skip-license --prefix=/usr/local/ --exclude-subdir
rm ${cmake_file}
"""

# Set compiler to clang
environment = { CC = "clang", CXX = "clang++" }

# Test the built wheel
test-command = "python -c \"import tenseal; print(f'TenSEAL version: {tenseal.__version__}')\""

[tool.cibuildwheel.macos]
# macOS deployment targets
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
test-command = "python -c \"import tenseal; print(f'TenSEAL version: {tenseal.__version__}')\""

[tool.cibuildwheel.windows]
archs = ["AMD64"]
test-command = "python -c \"import tenseal; print(f'TenSEAL version: {tenseal.__version__}')\""
